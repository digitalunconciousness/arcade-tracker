# Cabcrawl with PostgreSQL, on one machine. Settings come from .env next to this file:
#
#   SECRET_KEY=<32 or more random characters>     required
#   POSTGRES_PASSWORD=<a password for the database> required
#   BASE_URL=https://cabcrawl.example.org          before printing QR labels
#   TRUSTED_PROXY=<your reverse proxy's address>   if a proxy terminates HTTPS in front of it
#
# Then: docker compose up -d, and open http://localhost:5000/setup to make the first admin.
# Any other setting from .env.example can go in .env too.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: cabcrawl
      POSTGRES_USER: cabcrawl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabcrawl -d cabcrawl"]
      interval: 5s
      timeout: 5s
      retries: 20

  cabcrawl:
    build: .
    image: cabcrawl
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment: &app-env
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql://cabcrawl:${POSTGRES_PASSWORD}@db:5432/cabcrawl
      BASE_URL: ${BASE_URL:-}
      TRUSTED_PROXY: ${TRUSTED_PROXY:-}
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
      - photos:/app/static/maintenance_photos
      - profile-pics:/app/static/profile_pics
    depends_on:
      db:
        condition: service_healthy

  alerts:
    image: cabcrawl
    command: alerts
    restart: unless-stopped
    healthcheck:
      disable: true          # it serves nothing; the image's check is for the web container
    env_file:
      - path: .env
        required: false
    environment: *app-env
    depends_on:
      cabcrawl:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  photos:
  profile-pics:
