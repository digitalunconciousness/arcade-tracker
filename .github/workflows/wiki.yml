name: wiki

# Publishes docs/wiki/ to the repository's wiki. The wiki is a copy: its pages are edited here,
# through a pull request, and each run replaces the wiki's content with them. An edit made on the
# wiki itself is overwritten by the next run. docs/wiki/README.md stays in the repository.
on:
  push:
    branches: [master]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write          # the wiki is written with the repository's own token

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy docs/wiki/ to the wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki
          find wiki -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/wiki/. wiki/
          rm -f wiki/README.md
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches docs/wiki/."
            exit 0
          fi
          git commit -m "Publish docs/wiki/ from ${GITHUB_SHA::7}"
          git push
