{% extends "base.html" %}

{% block title %}Skeeball Statistics{% endblock %}

{% block content %}
<style>
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; margin-top: 20px; }
  .stat-card { background: var(--card-bg, rgba(0, 15, 25, 0.8)); border: 2px solid #00ffff; border-radius: 12px; padding: 25px; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
  .stat-card h2 { color:#00ffff; margin-bottom: 15px; border-bottom: 2px solid rgba(0,255,255,0.3); padding-bottom: 10px; }
  .stat-row { display:flex; justify-content: space-between; align-items:center; padding:10px 0; border-bottom: 1px solid rgba(0,255,255,0.15); }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color:#00ffff; font-size:0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-weight: 800; font-size: 1.2rem; color: #ff00ff; }
  .empty-state { text-align: center; padding: 60px; color: #00ffff; background: var(--card-bg, rgba(0,15,25,0.8)); border: 2px dashed rgba(0,255,255,0.3); border-radius: 12px; }
</style>

<div class="skeeball-header" style="text-align:center; margin-bottom: 30px;">
  <h1 class="glitch" data-text="SKEEBALL STATISTICS">SKEEBALL STATISTICS</h1>
  <p style="color:#00ffff; opacity:0.8">Live performance metrics per lane</p>
</div>

<div class="stats-grid" id="statsContainer">
  <div class="empty-state">
    <h2 style="color:#ff00ff;">Loading statistics...</h2>
    <p>Please wait while we fetch the lane statistics</p>
  </div>
</div>

<script>
  async function loadStats() {
    try {
      const response = await fetch('/skeeball/api/lanes');
      const lanes = await response.json();

      if (!lanes || Object.keys(lanes).length === 0) {
        document.getElementById('statsContainer').innerHTML = `
          <div class="empty-state">
            <h2 style="color:#ff00ff;">No lanes active</h2>
            <p>No skeeball lanes are currently registered</p>
          </div>`;
        return;
      }

      let html = '';
      for (const [laneId, lane] of Object.entries(lanes)) {
        const statsResponse = await fetch(`/skeeball/api/lanes/${laneId}/stats`);
        const stats = await statsResponse.json();
        html += `
          <div class="stat-card">
            <h2>${laneId}</h2>
            <div class="stat-row"><span class="stat-label">Total Games</span><span class="stat-value">${stats.total_games}</span></div>
            <div class="stat-row"><span class="stat-label">Total Coins</span><span class="stat-value">${stats.total_coins}</span></div>
            <div class="stat-row"><span class="stat-label">Best Score</span><span class="stat-value">${stats.best_score}</span></div>
            <div class="stat-row"><span class="stat-label">Status</span><span class="stat-value" style="font-size:0.95rem;">${lane.in_progress ? 'Playing' : (lane.is_online ? 'Ready' : 'Offline')}</span></div>
          </div>`
      }
      document.getElementById('statsContainer').innerHTML = html;
    } catch (e) {
      console.error('Failed to load statistics:', e);
      document.getElementById('statsContainer').innerHTML = `
        <div class="empty-state">
          <h2 style="color:#ff00ff;">Error loading statistics</h2>
          <p>${e.message}</p>
        </div>`;
    }
  }

  loadStats();
  setInterval(loadStats, 1000);
</script>
{% endblock %}
