<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Skeeball Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .back-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: inline-block;
        }
        
        .back-link:hover {
            color: white;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .status-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .status-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .status-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
            margin-top: 5px;
        }
        
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-success {
            background: #48bb78;
            color: white;
        }
        
        .btn-success:hover {
            background: #38a169;
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .roll-outcomes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }
        
        .outcome-btn {
            padding: 15px;
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 8px;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .outcome-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }
        
        .event-log {
            background: #2d3748;
            color: #a0aec0;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #4a5568;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-time {
            color: #90cdf4;
        }
        
        .log-event {
            color: #68d391;
        }
        
        .log-score {
            color: #f6ad55;
        }
        
        section {
            margin-bottom: 30px;
        }
        
        .refresh-button {
            float: right;
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        
        .refresh-button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/skeeball/" class="back-link">← Back to Control Center</a>
        <h1> Skeeball Simulator</h1>
        
        <!-- Game Status -->
        <div class="card">
            <h2> Game Status</h2>
            <button class="refresh-button" onclick="updateStatus()">Refresh</button>
            
            <div class="status-grid">
                <div class="status-item">
                    <div class="status-label">Credits</div>
                    <div class="status-value" id="credits">0</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Score</div>
                    <div class="status-value" id="score">0</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Balls</div>
                    <div class="status-value" id="balls">0/9</div>
                </div>
                <div class="status-item">
                    <div class="status-label">Status</div>
                    <div class="status-value" id="status" style="font-size: 1rem;">Idle</div>
                </div>
            </div>
        </div>
        
        <!-- Main Controls -->
        <div class="card">
            <h2> Controls</h2>
            <div class="controls">
                <button class="btn-success" onclick="insertCoin()"> Coin</button>
                <button class="btn-primary" onclick="trigger('score', 'score_10')">⊕ +10</button>
                <button class="btn-primary" onclick="trigger('score', 'score_50')">⊕ +50</button>
                <button class="btn-primary" onclick="trigger('score', 'lane_track')"> Lane</button>
                <button class="btn-primary" onclick="trigger('ball_scored', null)"> Ball</button>
                <button class="btn-danger" onclick="resetGame()"> Reset</button>
            </div>
        </div>
        
        <!-- Roll Simulator -->
        <div class="card">
            <h2> Roll Outcomes</h2>
            <p style="color: #666; margin-bottom: 15px;">Simulate complete roll sequences</p>
            <div class="roll-outcomes">
                <button class="outcome-btn" onclick="rollOutcome('Miss')">Miss</button>
                <button class="outcome-btn" onclick="rollOutcome('10')">10</button>
                <button class="outcome-btn" onclick="rollOutcome('20')">20</button>
                <button class="outcome-btn" onclick="rollOutcome('30')">30</button>
                <button class="outcome-btn" onclick="rollOutcome('40')">40</button>
                <button class="outcome-btn" onclick="rollOutcome('50')">50</button>
                <button class="outcome-btn" onclick="rollOutcome('100')">100 </button>
            </div>
        </div>
        
        <!-- Event Log -->
        <div class="card">
            <h2> Event Log</h2>
            <div class="event-log" id="eventLog">
                <div class="log-entry"><span class="log-time">[Ready]</span> Waiting for events...</div>
            </div>
        </div>
    </div>
    
    <script>
        let autoRefresh = setInterval(updateStatus, 500);
        
        async function updateStatus() {
            try {
                const response = await fetch('/skeeball/api/lanes/lane_1/status');
                const data = await response.json();
                
                document.getElementById('credits').textContent = data.credits;
                document.getElementById('score').textContent = data.score;
                document.getElementById('balls').textContent = `${data.balls}/${data.total_balls}`;
                document.getElementById('status').textContent = data.in_progress ? ' Playing' : '⏸ Idle';
            } catch (e) {
                console.error('Failed to update status:', e);
            }
        }
        
        async function insertCoin() {
            logEvent('Inserting coin...');
            const response = await fetch('/skeeball/api/simulator/insert-coin', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lane_id: 'lane_1'})
            });
            const data = await response.json();
            logEvent(' Credit added! Total: ' + data.credits);
            updateStatus();
        }
        
        async function trigger(event, eventData) {
            const eventNames = {
                'score_10': '⊕ +10 points',
                'score_50': '⊕ +50 points',
                'lane_track': ' Lane track (50 pts)'
            };
            
            let endpoint = '';
            if (event === 'score' && eventData === 'score_10') endpoint = '/skeeball/api/simulator/score-10';
            else if (event === 'score' && eventData === 'score_50') endpoint = '/skeeball/api/simulator/score-50';
            else if (event === 'score' && eventData === 'lane_track') endpoint = '/skeeball/api/simulator/lane-track';
            else if (event === 'ball_scored') endpoint = '/skeeball/api/simulator/ball-scored';
            
            if (!endpoint) return;
            
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lane_id: 'lane_1'})
            });
            const data = await response.json();
            
            const eventName = eventNames[eventData] || event;
            logEvent(`${eventName} | Score: ${data.score}`);
            updateStatus();
        }
        
        async function rollOutcome(outcome) {
            logEvent(` Rolling... (${outcome} pts)`);
            const response = await fetch('/skeeball/api/roll-outcome', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lane_id: 'lane_1', outcome: outcome})
            });
            const data = await response.json();
            logEvent(` Roll complete! Score: ${data.lane_status.score}, Events: ${data.sequence_executed}`);
            updateStatus();
        }
        
        async function resetGame() {
            logEvent(' Resetting game...');
            const response = await fetch('/skeeball/api/lanes/lane_1/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'}
            });
            const data = await response.json();
            logEvent(' Game reset!');
            updateStatus();
        }
        
        function logEvent(message) {
            const log = document.getElementById('eventLog');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">[${time}]</span> <span class="log-event">${message}</span>`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        // Initial load
        updateStatus();
    </script>
</body>
</html>
