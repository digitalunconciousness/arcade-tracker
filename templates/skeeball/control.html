{% extends "base.html" %}

{% block title %}Skeeball Control Panel{% endblock %}

{% block content %}
<style>
    .lanes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; margin-top: 20px; position: relative; z-index: 1; }
    .lane-card { background: var(--card-bg, rgba(0, 15, 25, 0.8)); border: 2px solid #00ffff; border-radius: 12px; padding: 25px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); position: relative; z-index: 2; min-height: 300px; }
    .lane-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid rgba(0,255,255,0.3); }
    .lane-title { font-size: 1.5rem; font-weight: 700; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.5); }
    .lane-status { padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .status-online { background: rgba(0,255,0,0.2); color:#00ff00; border:1px solid #00ff00; box-shadow: 0 0 10px rgba(0,255,0,0.3);} 
    .status-offline { background: rgba(255,0,0,0.2); color:#ff0000; border:1px solid #ff0000; box-shadow: 0 0 10px rgba(255,0,0,0.3);} 
    .status-playing { background: rgba(255,0,255,0.2); color:#ff00ff; border:1px solid #ff00ff; box-shadow: 0 0 10px rgba(255,0,255,0.3);} 
    .stat { display:flex; justify-content: space-between; align-items:center; margin-bottom:15px; padding:10px; background: rgba(0,255,255,0.05); border-radius:6px; border-left:3px solid #00ffff; }
    .stat-label { font-size:0.9rem; color:#00ffff; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
    .stat-value { font-size:1.8rem; font-weight:900; color:#ff00ff; text-shadow: 0 0 10px rgba(255,0,255,0.5); font-family: 'Courier New', monospace; }
    .empty-state { text-align:center; padding:60px; color:#00ffff; background: var(--card-bg, rgba(0,15,25,0.8)); border: 2px dashed rgba(0,255,255,0.3); border-radius: 12px; }
    .system-controls { background: var(--card-bg, rgba(0,15,25,0.8)); border: 2px solid #00ffff; border-radius: 8px; padding: 20px; margin-bottom: 30px; box-shadow: 0 0 20px rgba(0,255,255,0.3); }
    .reboot-btn { background: rgba(255,0,0,0.1); border:2px solid #ff0000; color:#ff0000; padding:12px 24px; border-radius:6px; font-weight:700; }
</style>

<div class="skeeball-header" style="text-align:center; margin-bottom: 30px;">
  <h1>🎳 SKEEBALL CONTROL CENTER</h1>
  <p style="color:#00ffff; opacity:0.8">Registered Lanes Overview</p>
</div>

<div class="lane-card">
  <h2 style="color:#00ffff; margin-bottom: 20px;">🎮 Active Lanes</h2>
  <div id="lanesContainer">
    <p style="text-align:center; padding: 40px; color:#00ffff;">Loading lane information...</p>
  </div>
</div>

<script>
  function getCsrfToken() {
    const meta = document.querySelector('meta[name="csrf-token"]');
    return meta ? meta.getAttribute('content') : '';
  }

  async function loadLanes() {
    try {
      console.log('Fetching lanes from /skeeball/api/lanes...');
      const response = await fetch('/skeeball/api/lanes');
      console.log('Response status:', response.status);
      
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      
      const lanes = await response.json();
      console.log('Lanes data:', lanes);

      if (!lanes || Object.keys(lanes).length === 0) {
        document.getElementById('lanesContainer').innerHTML = `
          <p style="text-align:center; padding: 40px; color:#ff6666;">No lanes registered</p>`;
        return;
      }

      // Fetch stats for each lane to get coin count and high score
      let html = `
        <table class="table" style="width:100%; border-collapse: collapse;">
          <thead>
            <tr>
              <th style="text-align:left; padding:12px; color:#00ffff; border-bottom:2px solid rgba(0,255,255,0.3);">Lane ID</th>
              <th style="text-align:center; padding:12px; color:#00ffff; border-bottom:2px solid rgba(0,255,255,0.3);">Coin Count</th>
              <th style="text-align:center; padding:12px; color:#00ffff; border-bottom:2px solid rgba(0,255,255,0.3);">High Score</th>
              <th style="text-align:center; padding:12px; color:#00ffff; border-bottom:2px solid rgba(0,255,255,0.3);">Status</th>
            </tr>
          </thead>
          <tbody>`;
      
      for (const [laneId, lane] of Object.entries(lanes)) {
        // Fetch stats for this lane
        const statsResponse = await fetch(`/skeeball/api/lanes/${laneId}/stats`);
        const stats = await statsResponse.json();
        
        const statusClass = lane.is_online ? (lane.in_progress ? 'status-playing' : 'status-online') : 'status-offline';
        const statusText = lane.is_online ? (lane.in_progress ? 'Playing' : 'Ready') : 'Offline';
        
        html += `
          <tr style="border-bottom:1px solid rgba(0,255,255,0.1);">
            <td style="padding:12px; color:#fff;">${laneId}</td>
            <td style="padding:12px; text-align:center; color:#ff00ff; font-weight:bold;">${stats.total_coins}</td>
            <td style="padding:12px; text-align:center; color:#ff00ff; font-weight:bold;">${stats.best_score}</td>
            <td style="padding:12px; text-align:center;">
              <span class="lane-status ${statusClass}" style="padding:6px 12px; border-radius:20px; font-size:0.85rem; font-weight:bold;">${statusText}</span>
            </td>
          </tr>`;
      }
      
      html += '</tbody></table>';
      document.getElementById('lanesContainer').innerHTML = html;
    } catch (e) {
      console.error('Failed to load lanes:', e);
      console.error('Error stack:', e.stack);
      document.getElementById('lanesContainer').innerHTML = `
        <div class="empty-state">
          <h2 style="color:#ff00ff;">Error loading lanes</h2>
          <p style="color:#ff6666;">${e.message}</p>
          <p style="font-size:0.9rem; margin-top:10px;">Check browser console (F12) for details</p>
        </div>`;
    }
  }


  loadLanes();
  setInterval(loadLanes, 500);
</script>
{% endblock %}
