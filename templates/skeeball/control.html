<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Skeeball Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .back-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: inline-block;
        }
        
        .lanes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        
        .lane-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }
        
        .lane-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .lane-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #667eea;
        }
        
        .lane-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        
        .status-online {
            background: #d4edda;
            color: #155724;
        }
        
        .status-offline {
            background: #f8d7da;
            color: #721c24;
        }
        
        .status-playing {
            background: #cce5ff;
            color: #004085;
        }
        
        .stat {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
        }
        
        button {
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: #f56565;
            color: white;
        }
        
        .btn-danger:hover {
            background: #e53e3e;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: white;
        }
        
        .empty-state h2 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/skeeball/" class="back-link">← Back to Control Center</a>
        <h1> Lane Control Panel</h1>
        
        <div style="background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
            <div style="color: white;">
                <strong>System Controls</strong>
                <p style="margin: 5px 0 0 0; font-size: 0.9rem; opacity: 0.8;">Manage the Raspberry Pi system</p>
            </div>
            <button class="btn-danger" onclick="rebootSystem()" style="padding: 12px 24px;">
                 Reboot Raspberry Pi
            </button>
        </div>
        
        <div class="lanes-grid" id="lanesContainer">
            <div class="empty-state">
                <h2>Loading lanes...</h2>
                <p>Please wait while we fetch the lane information</p>
            </div>
        </div>
    </div>
    
    <script>
        async function loadLanes() {
            try {
                const response = await fetch('/skeeball/api/lanes');
                const lanes = await response.json();
                
                if (Object.keys(lanes).length === 0) {
                    document.getElementById('lanesContainer').innerHTML = `
                        <div class="empty-state">
                            <h2>No lanes active</h2>
                            <p>No skeeball lanes are currently registered</p>
                        </div>
                    `;
                    return;
                }
                
                let html = '';
                for (const [laneId, lane] of Object.entries(lanes)) {
                    const statusClass = lane.is_online ? 
                        (lane.in_progress ? 'status-playing' : 'status-online') : 
                        'status-offline';
                    const statusText = lane.is_online ? 
                        (lane.in_progress ? ' Playing' : ' Ready') : 
                        ' Offline';
                    
                    html += `
                        <div class="lane-card">
                            <div class="lane-header">
                                <div class="lane-title"> ${laneId}</div>
                                <div class="lane-status ${statusClass}">${statusText}</div>
                            </div>
                            
                            <div class="stat">
                                <div class="stat-label">Credits</div>
                                <div class="stat-value">${lane.credits}</div>
                            </div>
                            
                            <div class="stat">
                                <div class="stat-label">Score</div>
                                <div class="stat-value">${lane.score}</div>
                            </div>
                            
                            <div class="stat">
                                <div class="stat-label">Balls</div>
                                <div class="stat-value">${lane.balls}/${lane.total_balls}</div>
                            </div>
                            
                            <div class="stat">
                                <div class="stat-label">Last Event</div>
                                <div class="stat-value" style="font-size: 0.85rem;">${lane.last_event ? new Date(lane.last_event).toLocaleTimeString() : 'None'}</div>
                            </div>
                            
                            <div class="action-buttons">
                                <button class="btn-primary" onclick="insertCoin('${laneId}')"> Coin</button>
                                <button class="btn-danger" onclick="resetLane('${laneId}')"> Reset</button>
                            </div>
                        </div>
                    `;
                }
                document.getElementById('lanesContainer').innerHTML = html;
            } catch (e) {
                console.error('Failed to load lanes:', e);
                document.getElementById('lanesContainer').innerHTML = `
                    <div class="empty-state">
                        <h2>Error loading lanes</h2>
                        <p>${e.message}</p>
                    </div>
                `;
            }
        }
        
        async function insertCoin(laneId) {
            await fetch(`/skeeball/api/simulator/insert-coin`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({lane_id: laneId})
            });
            loadLanes();
        }
        
        async function resetLane(laneId) {
            if (confirm(`Reset lane ${laneId}? This will clear the current game.`)) {
                await fetch(`/skeeball/api/lanes/${laneId}/reset`, {
                    method: 'POST'
                });
                loadLanes();
            }
        }
        
        async function rebootSystem() {
            if (confirm('WARNING: This will reboot the Raspberry Pi system. All games will be interrupted. Continue?')) {
                try {
                    const response = await fetch('/skeeball/api/system/reboot', {
                        method: 'POST'
                    });
                    if (response.ok) {
                        alert('Reboot command sent. The system will restart in a few seconds.');
                    } else {
                        const error = await response.json();
                        alert('Reboot failed: ' + (error.error || 'Unknown error'));
                    }
                } catch (e) {
                    alert('Failed to send reboot command: ' + e.message);
                }
            }
        }
        
        // Load lanes on page load and refresh every 2 seconds
        loadLanes();
        setInterval(loadLanes, 2000);
    </script>
</body>
</html>
